[package]
name = "seatling-node"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
seatling = { path = "../seatling" }
serde_json = "1.0"
napi = { version = "2.16", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2.1"
