[package]
name = "seatling-node"
version = "1.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
seatling = { path = "../seatling" }
serde_json = "1.0"
napi = { version = "3.14", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.6"
rand = "0.10"
hex = "0.4"

[build-dependencies]
napi-build = "2.1"
