version: 2
updates:
  - package-ecosystem: cargo
    assignees:
      - stfsy
    directory: /
    schedule:
      interval: monthly
    groups:
      # Dependabot's dependency-type (development/production) grouping is not supported for cargo;
      # grouping non-breaking updates into one PR.
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "aes-gcm"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    assignees:
      - stfsy
    directory: /crates/seatling-node
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    assignees:
      - stfsy
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
