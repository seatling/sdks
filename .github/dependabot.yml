version: 2
updates:
  - package-ecosystem: cargo
    assignees:
      - stfsy
    directory: /
    schedule:
      interval: monthly
    groups:
      # Dependabot's dependency-type (development/production) grouping is not supported for cargo;
      # grouping non-breaking updates into one PR.
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    assignees:
      - stfsy
    directory: /crates/seatling-node
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
      prod-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    assignees:
      - stfsy
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
