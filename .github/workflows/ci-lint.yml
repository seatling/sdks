name: CI — Contract & License Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci-lint.yml
      - openapi.yaml
      - package.json
      - LICENSE
      - crates/**/LICENSE
      - scripts/stamp-license-date.js
      - crates/seatling/include/seatling/seatling.h
      - crates/seatling-go/include/seatling.h
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci-lint.yml
      - openapi.yaml
      - package.json
      - LICENSE
      - crates/**/LICENSE
      - scripts/stamp-license-date.js
      - crates/seatling/include/seatling/seatling.h
      - crates/seatling-go/include/seatling.h

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  openapi-lint:
    name: Lint OpenAPI & BSL License
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1.25.1 lint openapi.yaml

      - name: Verify C Header Parity (C++ & Go SDKs)
        run: cmp -s crates/seatling/include/seatling/seatling.h crates/seatling-go/include/seatling.h

      - name: Validate BSL License Change Dates
        run: node scripts/stamp-license-date.js --check
