name: CI (Multi-Platform Build & Test)

on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - package.json
      - package-lock.json
      - openapi.yaml
      - crates/**
      - .github/workflows/ci.yml
  pull_request:
    branches:
      - main
    paths:
      - Cargo.lock
      - package.json
      - package-lock.json
      - openapi.yaml
      - crates/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  openapi-lint:
    name: Lint OpenAPI & BSL License
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1.25.1 lint openapi.yaml

      - name: Verify C Header Parity (C++ & Go SDKs)
        run: cmp -s crates/seatling/include/seatling/seatling.h crates/seatling-go/include/seatling.h

      - name: Validate BSL License Change Dates
        run: node scripts/stamp-license-date.js --check

  rust-workspace:
    name: Rust Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core Tests
        run: cargo test --workspace

  node-sdk:
    name: Node SDK / ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: [rust-workspace]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [lts/*]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Seatling Native Node Addon
        run: cargo build --release -p seatling-node

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: crates/seatling-node/package.json

      - name: Install Node Dependencies
        working-directory: crates/seatling-node
        run: npm install

      - name: Lint TypeScript
        working-directory: crates/seatling-node
        run: npm run lint

      - name: Run Node Test Suite (Unit, Network, Edge & E2E)
        working-directory: crates/seatling-node
        run: npm test

  cpp-sdk:
    name: C++ SDK / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [rust-workspace]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Seatling Rust Staticlib
        run: cargo build --release -p seatling

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.28.x"

      - name: Configure CMake
        run: cmake -B build -S crates/seatling

      - name: Build C++ Test Suite & Example
        run: cmake --build build --config Release

      - name: Run CTest Suite (Against Rust Staticlib)
        run: ctest --test-dir build -C Release --output-on-failure

  go-sdk:
    name: Go SDK / ${{ matrix.os }} (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    needs: [rust-workspace]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.22", "1.23"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}

      - name: Build Seatling Core Staticlib
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build --release --target x86_64-pc-windows-gnu -p seatling
          else
            cargo build --release -p seatling
          fi

      - name: Setup Zig Compiler
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Prepare Local Static Archives for Go
        shell: bash
        run: |
          mkdir -p crates/seatling-go/lib/linux_amd64
          mkdir -p crates/seatling-go/lib/darwin_arm64
          mkdir -p crates/seatling-go/lib/darwin_amd64
          mkdir -p crates/seatling-go/lib/windows_amd64

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/x86_64-pc-windows-gnu/release/libseatling.a crates/seatling-go/lib/windows_amd64/libseatling.a
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/release/libseatling.a crates/seatling-go/lib/darwin_arm64/libseatling.a
            cp target/release/libseatling.a crates/seatling-go/lib/darwin_amd64/libseatling.a
          else
            cp target/release/libseatling.a crates/seatling-go/lib/linux_amd64/libseatling.a
          fi

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: crates/seatling-go/go.mod

      - name: Lint Go (go vet via CGO)
        run: node scripts/run-go.js vet ./...

      - name: Run Go Test Suite (Static CGO)
        run: node scripts/run-go.js test -v ./...

      - name: Build Standalone Go Example Binary
        run: node scripts/run-go.js build -o example_bin ./examples/main.go


