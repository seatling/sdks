name: Release Please (Unified Platform Release)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  release:
    name: Manage Release PR & Tags
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Code for License Stamping
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp BSL Change Date in Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DATA: ${{ steps.release.outputs.pr }}
        run: |
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headBranchName // empty')
          if [ -n "$HEAD_BRANCH" ]; then
            git fetch origin "$HEAD_BRANCH"
            git checkout "$HEAD_BRANCH"
            node scripts/stamp-license-date.js
            if [ -n "$(git status --porcelain LICENSE crates/seatling-node/LICENSE)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add LICENSE crates/seatling-node/LICENSE
              git commit -m "chore(license): automate BSL Change Date (+4 years)"
              git push origin "$HEAD_BRANCH"
            fi
          fi

  build-release-assets:
    name: Build / ${{ matrix.target }}
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_name: seatling.win32-x64-msvc.node
            artifact_name: seatling-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            node_name: seatling.darwin-arm64.node
            artifact_name: seatling-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            node_name: seatling.darwin-x64.node
            artifact_name: seatling-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node_name: seatling.linux-x64-gnu.node
            artifact_name: seatling-linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Core Staticlib & C-Dylib
        run: cargo build --release --target ${{ matrix.target }} -p seatling

      - name: Build Node N-API Addon
        run: cargo build --release --target ${{ matrix.target }} -p seatling-node

      - name: Prepare Artifact Package
        shell: bash
        run: |
          mkdir -p dist-pkg/include/seatling
          cp crates/seatling/include/seatling/* dist-pkg/include/seatling/
          cp LICENSE dist-pkg/LICENSE
          mkdir -p dist-pkg/lib
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/seatling.lib dist-pkg/lib/
            cp target/${{ matrix.target }}/release/seatling.dll dist-pkg/lib/
            cp target/${{ matrix.target }}/release/seatling_node.dll dist-pkg/${{ matrix.node_name }}
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp target/${{ matrix.target }}/release/libseatling.a dist-pkg/lib/
            cp target/${{ matrix.target }}/release/libseatling.dylib dist-pkg/lib/
            cp target/${{ matrix.target }}/release/libseatling_node.dylib dist-pkg/${{ matrix.node_name }}
          else
            cp target/${{ matrix.target }}/release/libseatling.a dist-pkg/lib/
            cp target/${{ matrix.target }}/release/libseatling.so dist-pkg/lib/
            cp target/${{ matrix.target }}/release/libseatling_node.so dist-pkg/${{ matrix.node_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-pkg/*

  attach-to-release:
    name: Attach Precompiled Binaries to Release
    needs: [release, build-release-assets]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Release Archives
        run: |
          mkdir -p release-archives
          for dir in artifacts/*; do
            platform=$(basename "$dir")
            tar -czvf "release-archives/${platform}.tar.gz" -C "$dir" .
          done

      - name: Attach Archives to GitHub Release
        run: |
          gh release upload "${{ needs.release.outputs.tag_name }}" release-archives/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: [release, attach-to-release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Addon
        run: cargo build --release -p seatling-node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build TypeScript
        working-directory: crates/seatling-node
        run: |
          node ../../scripts/stamp-license-date.js
          npm install
          npm run build

      - name: Publish to NPM
        working-directory: crates/seatling-node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
