name: Release Please (Unified Platform Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Manage Release PR & Tags
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout Code for License Stamping
        if: ${{ steps.release.outputs.pr != '' }}
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Stamp BSL Change Date in Release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DATA: ${{ steps.release.outputs.pr }}
        run: |
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headBranchName // empty')
          if [ -n "$HEAD_BRANCH" ]; then
            git fetch origin "$HEAD_BRANCH"
            git checkout "$HEAD_BRANCH"
            node scripts/stamp-license-date.js
            if [ -n "$(git status --porcelain LICENSE crates/seatling-node/LICENSE)" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add LICENSE crates/seatling-node/LICENSE
              git commit -m "chore(license): automate BSL Change Date (+4 years)"
              git push origin "$HEAD_BRANCH"
            fi
          fi

  publish:
    name: Trigger Asset & Package Publishing
    needs: [release]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/publish-release.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  mirror:
    name: Trigger Go SDK Mirroring
    needs: [release, publish]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/mirror.yml
    with:
      tag_name: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
