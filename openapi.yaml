openapi: 3.1.0
info:
  title: Seatling Client License API
  description: |
    Language-agnostic client-facing licensing and seat management API for the Seatling platform.
    Adheres to the Zero-Prompt Ed25519 Hybrid Hardware Anchor Architecture (HARDWARE_ANCHOR_V7.md).
    Features RFC 7519 / RFC 8037 EdDSA (Ed25519) JSON Web Tokens for Proof-of-Possession seat activation,
    1-RTT Mutual-Challenge Heartbeats with echoed nonces, and Hardened Bidirectional Self-Healing.
    Error responses strictly adhere to RFC 9457 Problem Details (application/problem+json) with zero sensitive data leakage.
  version: 1.0.0
  contact:
    name: Seatling Architecture Team
    url: https://seatling.com
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1

servers:
  - url: https://api.seatling.com
    description: Production API Gateway
  - url: https://api-staging.seatling.com
    description: Staging Environment

security: []

paths:
  /v1/licenses/activate:
    post:
      summary: Activate Machine Seat
      description: |
        Activates a machine seat on an active license using a cryptographic Proof-of-Possession (PoP) JWT (typ: seatling-activate-pop+jwt).
        Supports Hardened Bidirectional Self-Healing:
        - Case A (App Reinstall / Cache Clear): If the 4-component HWID matches an existing seat (weighted score >= 70: mobo 35, cpu 25, disk 20, os_uuid 20)
          and passes the 30-day rotation quota, the seat's public key is rotated in-place (0 seats burned).
        - Case B (Hardware / OS Upgrade): If the device holds a valid hardware-sealed Ed25519 key matching an existing seat,
          the HWID components are updated in-place without consuming a seat.
      operationId: activateLicenseSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationTokenRequest'
      responses:
        '200':
          description: 'Machine seat activated or self-healed successfully. Returns Server-Signed License JWT (typ: seatling-license+jwt).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationTokenResponse'
        '400':
          description: Invalid activation request (bad timestamp, malformed HWID, or invalid PoP JWT).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationProblemDetails'
                  - $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Seats exhausted, version ceiling exceeded, key revoked, or license suspended.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SeatsExhaustedProblem'
                  - $ref: '#/components/schemas/VersionNotEntitledProblem'
                  - $ref: '#/components/schemas/KeyRevokedProblem'
                  - $ref: '#/components/schemas/LicenseSuspendedProblem'
        '404':
          description: License key not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Requires customer portal deactivation (concurrent active session detected or rotation quota exceeded).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RequiresPortalDeactivationProblem'

  /v1/licenses/heartbeat:
    post:
      summary: 1-RTT Mutual-Challenge Heartbeat
      description: |
        Performs a single-round-trip mutual challenge heartbeat using RFC 8037 EdDSA JWTs.
        1. The client signs a challenge JWT (typ: seatling-heartbeat-challenge+jwt) embedding session_id, app_version, and a random jti nonce.
        2. The server verifies the signature, session_id, app_version, and timestamp (+-5m), updates seat.last_heartbeat_at.
        3. The server responds with a 200 OK containing an acknowledgment JWT (typ: seatling-heartbeat-ack+jwt) counter-signed by the workspace Ed25519 key (matching client supported_kids) that echoes the client's jti nonce.
      operationId: heartbeatLicenseSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatTokenRequest'
      responses:
        '200':
          description: Heartbeat accepted. Returns server-signed Heartbeat Acknowledgment JWT echoing nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatTokenResponse'
        '400':
          description: Invalid heartbeat payload or expired timestamp.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationProblemDetails'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Heartbeat verification failed (device signature invalid or seat key mismatch).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Version not entitled, key revoked, or license suspended/revoked.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VersionNotEntitledProblem'
                  - $ref: '#/components/schemas/KeyRevokedProblem'
                  - $ref: '#/components/schemas/LicenseSuspendedProblem'
        '409':
          description: Seat requires customer portal deactivation (concurrent use anomaly detected).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RequiresPortalDeactivationProblem'

  /v1/licenses/deactivate:
    post:
      summary: Deactivate Machine Seat
      description: |
        Explicitly releases the allocated machine seat slot using an RFC 8037 EdDSA
        Deactivation Proof JWT (typ: seatling-deactivate+jwt) signed by the device private key.
      operationId: deactivateLicenseSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivationTokenRequest'
      responses:
        '200':
          description: Seat successfully released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivationResponse'
        '400':
          description: Invalid deactivation token or expired timestamp.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationProblemDetails'
                  - $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Deactivation signature invalid or seat not bound to device key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Seat already deactivated, freed, or absent on server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    AttestationTier:
      type: string
      enum:
        - hardware_sealed
        - software
      description: Attestation protection level of the private key.

    HWIDComponents:
      type: object
      required:
        - cpu
        - mobo
        - disk
        - os_uuid
      properties:
        cpu:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 'a6c98f8e7b9d4213c41fa2f05b1c94d0c15ef102e3b8a1c94d0c15ef102e3b8a'
        mobo:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 'b1c94d0c15ef102e3b8aa6c98f8e7b9d4213c41fa2f05b1c94d0c15ef102e3b8'
        disk:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 'c41fa2f05b1c94d0c15ef102e3b8aa6c98f8e7b9d4213c41fa2f05b1c94d0c15'
        os_uuid:
          type: string
          pattern: '^[a-f0-9]{64}$'
          example: 'd0c15ef102e3b8aa6c98f8e7b9d4213c41fa2f05b1c94d0c15ef102e3b8ac41f'

    ActivationPopClaims:
      type: object
      required:
        - iss
        - sub
        - aud
        - hwid
        - hwid_components
        - app_version
        - attestation_tier
        - iat
        - jti
        - supported_kids
      properties:
        iss:
          type: string
          description: Base64-encoded device public key.
        sub:
          type: string
          description: License key.
        aud:
          type: string
          description: API endpoint URL.
        hwid:
          type: string
          pattern: '^[a-f0-9]{64}$'
        hwid_components:
          $ref: '#/components/schemas/HWIDComponents'
        app_version:
          type: string
          example: '2.4.1'
        attestation_tier:
          $ref: '#/components/schemas/AttestationTier'
        iat:
          type: integer
          format: int64
        jti:
          type: string
        supported_kids:
          type: array
          items:
            type: string
          description: List of key IDs (kids) trusted by the client binary, sorted lexicographically.
          example: ["prod_synth_2026_v1", "prod_synth_2027_v1"]

    HeartbeatChallengeClaims:
      type: object
      required:
        - iss
        - sub
        - aud
        - seat_id
        - hwid
        - session_id
        - app_version
        - iat
        - jti
        - supported_kids
      properties:
        iss:
          type: string
          description: Base64-encoded device public key.
        sub:
          type: string
          description: License key.
        aud:
          type: string
          description: API endpoint URL.
        seat_id:
          type: string
          description: Seat ID allocated to this machine.
        hwid:
          type: string
          pattern: '^[a-f0-9]{64}$'
        session_id:
          type: string
          description: 128-bit random process session ID.
        app_version:
          type: string
          example: '2.4.1'
        iat:
          type: integer
          format: int64
        jti:
          type: string
          description: Random challenge nonce.
        supported_kids:
          type: array
          items:
            type: string
          description: List of key IDs (kids) trusted by the client binary, sorted lexicographically.
          example: ["prod_synth_2026_v1"]

    LicenseJwtClaims:
      type: object
      required:
        - iss
        - sub
        - aud
        - product_id
        - seat_id
        - hwid
        - device_key
        - app_version
        - iat
        - exp
        - status
      properties:
        iss:
          type: string
          description: Authority that issued the license token (e.g. API URL).
        sub:
          type: string
          description: License key bound to this seat.
        aud:
          type: string
          description: Workspace identifier.
        product_id:
          type: string
          description: Product identifier.
        seat_id:
          type: string
          description: Allocated seat identifier.
        masked_key:
          type: string
          description: Masked license key safe for client UI display.
          example: 'SEAT-****-****-4444'
        buyer_email:
          type: string
          pattern: '^[a-zA-Z0-9]\*{3}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
          description: Masked buyer email hint safe for client UI display. Full email is never revealed.
          example: 'b***@gmail.com'
        hwid:
          type: string
          pattern: '^[a-f0-9]{64}$'
        device_key:
          type: string
          description: Base64/Base64URL-encoded 32-byte Ed25519 device public key bound to this seat.
          example: '11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo'
        app_version:
          type: string
          example: '2.4.1'
        iat:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        offline_grace_days:
          type: integer
          description: Number of offline grace days granted.
          example: 14
        status:
          type: string
          enum: [active, suspended, revoked]
          example: 'active'
        entitlements:
          type: object
          additionalProperties: true
          description: Feature flags and metadata entitlements.

    HeartbeatAckClaims:
      type: object
      required:
        - iss
        - sub
        - aud
        - product_id
        - seat_id
        - status
        - iat
        - exp
        - jti
      properties:
        iss:
          type: string
        sub:
          type: string
        aud:
          type: string
        product_id:
          type: string
        seat_id:
          type: string
        status:
          type: string
          enum: [active, locked, suspended, revoked]
          example: 'active'
        iat:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        jti:
          type: string
          description: Echoed client challenge nonce.
        entitlements:
          type: object
          additionalProperties: true

    DeactivationClaims:
      type: object
      required:
        - iss
        - sub
        - seat_id
        - hwid
        - iat
        - jti
      properties:
        iss:
          type: string
          description: Base64-encoded device public key.
        sub:
          type: string
          description: License key.
        seat_id:
          type: string
        hwid:
          type: string
          pattern: '^[a-f0-9]{64}$'
        iat:
          type: integer
          format: int64
        jti:
          type: string
          description: Random deactivation challenge nonce.

    ActivationTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: RFC 7519 / RFC 8037 EdDSA JWT signed by client DevicePrivateKey with typ 'seatling-activate-pop+jwt'.
          example: 'eyJhbGciOiJFZERTQSI...eyJpc3MiOiJkZXZpY2V...sig'
        claims:
          $ref: '#/components/schemas/ActivationPopClaims'
          description: Documentation schema of the claims payload encoded inside token.

    ActivationTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: RFC 7519 / RFC 8037 EdDSA License JWT signed by workspace Ed25519 key (kid in header) with typ 'seatling-license+jwt'.
          example: 'eyJhbGciOiJFZERTQSI...eyJpc3MiOiJzZWF0bGluZy...sig'
        claims:
          $ref: '#/components/schemas/LicenseJwtClaims'
          description: Documentation schema of the license claims payload encoded inside token.

    HeartbeatTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: RFC 7519 / RFC 8037 EdDSA JWT signed by client DevicePrivateKey with typ 'seatling-heartbeat-challenge+jwt'.
          example: 'eyJhbGciOiJFZERTQSI...eyJpc3MiOiJkZXZpY2V...sig'
        claims:
          $ref: '#/components/schemas/HeartbeatChallengeClaims'
          description: Documentation schema of the challenge claims payload encoded inside token.

    HeartbeatTokenResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: RFC 7519 / RFC 8037 EdDSA JWT signed by workspace Ed25519 key (kid in header matching client supported_kids) with typ 'seatling-heartbeat-ack+jwt' echoing client jti nonce.
          example: 'eyJhbGciOiJFZERTQSI...eyJpc3MiOiJzZWF0bGluZy...sig'
        claims:
          $ref: '#/components/schemas/HeartbeatAckClaims'
          description: Documentation schema of the acknowledgment claims payload encoded inside token.
        portal_url:
          type: string
          format: uri
          description: Static customer portal URL returned when seat status is locked. Never contains magic link tokens.
          example: 'https://portal.seatling.com'

    DeactivationTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: "Signed RFC 8037 EdDSA JWT (typ: seatling-deactivate+jwt) signed by the device private key."
          example: 'eyJhbGciOiJFZERTQSI...eyJzdWIiOiJTRUFULT...MEQCID...'
        claims:
          $ref: '#/components/schemas/DeactivationClaims'
          description: Documentation schema of the deactivation claims encoded inside token.

    DeactivationResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Seat successfully deactivated'

    # RFC 9457 Problem Details Schemas (application/problem+json)
    ProblemDetails:
      type: object
      required:
        - type
        - status
        - title
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          example: 'https://api.seatling.com/errors/invalid-signature'
        status:
          type: integer
          description: HTTP status code.
          example: 400
        title:
          type: string
          description: Short, human-readable summary of the problem type.
          example: 'Invalid Signature'
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence of the problem.
          example: 'The provided Ed25519 signature failed cryptographic verification.'
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence of the problem.

    ValidationError:
      type: object
      required:
        - detail
        - pointer
      properties:
        detail:
          type: string
          description: Safe schema rule violation description without echoing raw input values.
          example: 'must be a valid 64-character lowercase hex string'
        pointer:
          type: string
          description: JSON Pointer referencing the invalid property.
          example: '#/claims/hwid'

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationError'

    VersionNotEntitledProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - portal_url
          properties:
            portal_url:
              type: string
              format: uri
              description: Static customer portal URL to purchase an upgrade or download an entitled build.
              example: 'https://portal.seatling.com/licenses/upgrade'

    KeyRevokedProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            portal_url:
              type: string
              format: uri
              description: Static customer portal URL to download an updated build.
              example: 'https://portal.seatling.com/updates'

    SeatsExhaustedProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - portal_url
            - seats_active
            - seat_limit
          properties:
            portal_url:
              type: string
              format: uri
              description: Static customer portal URL to manage or revoke existing machine seats. Never contains magic link tokens.
              example: 'https://portal.seatling.com'
            buyer_email:
              type: string
              pattern: '^[a-zA-Z0-9]\*{3}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
              description: Masked buyer email address hint (e.g. b***@gmail.com). Full email is never revealed. Magic link is emailed directly here.
              example: 'b***@gmail.com'
            seats_active:
              type: integer
              description: Count of active seats. Never leaks machine names, IPs, or device keys of other seats.
              example: 2
            seat_limit:
              type: integer
              description: Maximum seat capacity for this license.
              example: 2

    RequiresPortalDeactivationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required:
            - portal_url
          properties:
            portal_url:
              type: string
              format: uri
              description: Static customer portal URL to manage or revoke existing machine seats. Never contains magic link tokens.
              example: 'https://portal.seatling.com'
            buyer_email:
              type: string
              pattern: '^[a-zA-Z0-9]\*{3}@[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
              description: Masked buyer email address hint (e.g. b***@gmail.com). Full email is never revealed. Magic link is emailed directly here.
              example: 'b***@gmail.com'

    LicenseSuspendedProblem:
      $ref: '#/components/schemas/ProblemDetails'
